<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandeja de mensajes</title>
<style>
  :root { --borde:#d9dde3; --fondo:#f5f6f8; --texto:#1d2330; --suave:#6b7280; --acento:#2563eb;
          --fb:#1877f2; --ig:#c13584; --wa:#128c4a; --alerta:#b45309; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--texto); background:var(--fondo); }
  button { font:inherit; cursor:pointer; border:1px solid var(--borde); background:#fff; border-radius:6px; padding:6px 10px; }
  button.primario { background:var(--acento); border-color:var(--acento); color:#fff; }
  input, select, textarea { font:inherit; border:1px solid var(--borde); border-radius:6px; padding:6px 8px; background:#fff; }
  #ingreso { max-width:320px; margin:15vh auto; background:#fff; padding:24px; border:1px solid var(--borde); border-radius:10px; }
  #ingreso h1 { font-size:18px; margin:0 0 12px; }
  #ingreso input { width:100%; margin-bottom:10px; }
  #app { display:none; height:100vh; grid-template-columns:340px 1fr 260px; }
  #lista { border-right:1px solid var(--borde); background:#fff; display:flex; flex-direction:column; min-height:0; }
  #filtros { padding:10px; display:grid; grid-template-columns:1fr 1fr; gap:6px; border-bottom:1px solid var(--borde); }
  #filtros input { grid-column:1 / -1; }
  #convs { overflow-y:auto; flex:1; }
  .conv { padding:10px 12px; border-bottom:1px solid #eef0f3; cursor:pointer; display:grid; grid-template-columns:auto 1fr auto; gap:4px 8px; }
  .conv:hover, .conv.activa { background:#eef4ff; }
  .conv .nombre { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .ultimo { grid-column:2 / 4; color:var(--suave); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .conv .hora { color:var(--suave); font-size:12px; }
  .etiqueta { font-size:11px; font-weight:700; color:#fff; border-radius:4px; padding:1px 6px; align-self:start; }
  .messenger { background:var(--fb); } .instagram { background:var(--ig); } .whatsapp { background:var(--wa); }
  .noleidos { background:var(--acento); color:#fff; border-radius:10px; font-size:11px; padding:0 6px; margin-left:4px; }
  .resuelta .nombre { color:var(--suave); }
  #hilo { display:flex; flex-direction:column; min-height:0; }
  #cabecera { padding:10px 14px; background:#fff; border-bottom:1px solid var(--borde); display:flex; gap:8px; align-items:center; }
  #cabecera h2 { font-size:16px; margin:0; flex:1; }
  #mensajes { flex:1; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .msj { max-width:70%; padding:8px 10px; border-radius:10px; background:#fff; border:1px solid var(--borde); white-space:pre-wrap; word-wrap:break-word; }
  .msj.saliente { align-self:flex-end; background:#e7f0ff; border-color:#c9dbff; }
  .msj .pie { font-size:11px; color:var(--suave); margin-top:4px; }
  .msj a { color:var(--acento); }
  #aviso { display:none; margin:0 14px; padding:8px 10px; background:#fff7e6; border:1px solid #f5d39b; color:var(--alerta); border-radius:6px; }
  #responder { display:flex; gap:8px; padding:10px 14px; background:#fff; border-top:1px solid var(--borde); }
  #responder textarea { flex:1; resize:vertical; min-height:42px; }
  #lateral { border-left:1px solid var(--borde); background:#fff; padding:12px; overflow-y:auto; }
  #lateral h3 { font-size:13px; margin:14px 0 6px; color:var(--suave); text-transform:uppercase; letter-spacing:.03em; }
  #lateral select, #lateral textarea { width:100%; }
  .nota { background:#fffbe8; border:1px solid #f1e3a1; border-radius:6px; padding:6px 8px; margin-bottom:6px; white-space:pre-wrap; }
  .nota .pie { font-size:11px; color:var(--suave); }
  .vacio { color:var(--suave); padding:20px; text-align:center; }
  #estado-red { font-size:12px; color:var(--suave); padding:6px 10px; border-top:1px solid var(--borde); }
  @media (max-width: 900px) { #app { grid-template-columns:1fr; height:auto; } #lista { max-height:45vh; } }
</style>
</head>
<body>

<form id="ingreso">
  <h1>Bandeja de mensajes</h1>
  <input id="clave" type="password" placeholder="Clave de la bandeja" autocomplete="current-password" required>
  <input id="yo" type="text" placeholder="Tu nombre (para firmar respuestas y notas)" maxlength="60">
  <button class="primario" type="submit">Entrar</button>
  <p id="error-ingreso" style="color:#b91c1c"></p>
</form>

<div id="app">
  <aside id="lista">
    <div id="filtros">
      <select id="f-estado"><option value="abierta">Abiertas</option><option value="resuelta">Resueltas</option><option value="">Todas</option></select>
      <select id="f-canal"><option value="">Todos los canales</option><option value="messenger">Messenger</option><option value="instagram">Instagram</option><option value="whatsapp">WhatsApp</option></select>
      <input id="f-buscar" type="search" placeholder="Buscar nombre, número o texto">
    </div>
    <div id="convs"></div>
    <div id="estado-red">Conectando…</div>
  </aside>

  <main id="hilo">
    <div id="cabecera"><h2 id="titulo">Elegí una conversación</h2>
      <button id="btn-estado" style="display:none"></button></div>
    <div id="mensajes"><div class="vacio">Los mensajes de Messenger, Instagram y WhatsApp aparecen a la izquierda.</div></div>
    <div id="aviso"></div>
    <form id="responder" style="display:none">
      <textarea id="texto" placeholder="Escribí la respuesta (Ctrl+Enter para enviar)" maxlength="4096"></textarea>
      <button class="primario" type="submit">Enviar</button>
    </form>
  </main>

  <aside id="lateral">
    <div id="detalle" style="display:none">
      <h3>Contacto</h3><div id="contacto"></div>
      <h3>Asignada a</h3><select id="agente"></select>
      <h3>Notas internas</h3>
      <div id="notas"></div>
      <form id="form-nota"><textarea id="nota" rows="2" placeholder="Nota solo para el equipo" maxlength="2000"></textarea>
        <button type="submit" style="margin-top:6px">Agregar nota</button></form>
    </div>
  </aside>
</div>

<script>
"use strict";
const NOMBRE_CANAL = { messenger: "FB", instagram: "IG", whatsapp: "WA" };
const $ = (id) => document.getElementById(id);
let clave = sessionStorage.getItem("clave") || "";
let yo = localStorage.getItem("yo") || "";
let actual = null;          // id de la conversación abierta
let firmaHilo = "";         // para no redibujar si no cambió nada
let agentes = [];

function el(tag, clase, texto) {
  const e = document.createElement(tag);
  if (clase) e.className = clase;
  if (texto !== undefined && texto !== null) e.textContent = texto;  // nunca innerHTML con datos de clientes
  return e;
}

function hora(iso) {
  if (!iso) return "";
  const f = new Date(iso), hoy = new Date();
  return f.toDateString() === hoy.toDateString()
    ? f.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
    : f.toLocaleDateString([], { day: "2-digit", month: "2-digit" }) + " " + f.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}

async function api(ruta, opciones = {}) {
  const r = await fetch(ruta, { ...opciones, headers: { "Authorization": "Bearer " + clave, "Content-Type": "application/json" } });
  if (r.status === 401) { salir("Clave incorrecta"); throw new Error("401"); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(datos.detail ? (typeof datos.detail === "string" ? datos.detail : JSON.stringify(datos.detail)) : "Error " + r.status);
  return datos;
}

function salir(mensaje) {
  sessionStorage.removeItem("clave"); clave = "";
  $("app").style.display = "none"; $("ingreso").style.display = "block";
  $("error-ingreso").textContent = mensaje || "";
}

$("ingreso").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  clave = $("clave").value; yo = $("yo").value.trim() || "agente";
  try {
    const cfg = await api("/api/config");
    sessionStorage.setItem("clave", clave); localStorage.setItem("yo", yo);
    iniciar(cfg);
  } catch (e) { if (e.message !== "401") $("error-ingreso").textContent = e.message; }
});

function iniciar(cfg) {
  agentes = cfg.agentes || [];
  $("ingreso").style.display = "none"; $("app").style.display = "grid";
  const sel = $("agente"); sel.replaceChildren(el("option", "", "Sin asignar"));
  sel.firstChild.value = "";
  for (const a of agentes) { const o = el("option", "", a); o.value = a; sel.appendChild(o); }
  const m = location.hash.match(/^#c(\d+)$/);
  if (m) abrir(Number(m[1]));
  refrescar(); setInterval(refrescar, 4000);
}

async function refrescar() {
  try {
    await cargarLista();
    if (actual) await cargarHilo(false);
    $("estado-red").textContent = "Actualizado " + new Date().toLocaleTimeString();
  } catch (e) { if (e.message !== "401") $("estado-red").textContent = "Sin conexión: " + e.message; }
}

async function cargarLista() {
  const p = new URLSearchParams({ estado: $("f-estado").value, canal: $("f-canal").value, buscar: $("f-buscar").value });
  const convs = await api("/api/conversaciones?" + p);
  const cont = $("convs"); cont.replaceChildren();
  if (!convs.length) cont.appendChild(el("div", "vacio", "No hay conversaciones con estos filtros."));
  for (const c of convs) {
    const fila = el("div", "conv" + (c.id === actual ? " activa" : "") + (c.estado === "resuelta" ? " resuelta" : ""));
    fila.appendChild(el("span", "etiqueta " + c.canal, NOMBRE_CANAL[c.canal] || c.canal));
    const nombre = el("span", "nombre", c.contacto_nombre || c.contacto_id);
    if (c.no_leidos > 0 && c.id !== actual) nombre.appendChild(el("span", "noleidos", c.no_leidos));
    fila.appendChild(nombre);
    fila.appendChild(el("span", "hora", hora(c.ultima_actividad)));
    fila.appendChild(el("span", "ultimo", (c.agente ? "[" + c.agente + "] " : "") + (c.ultimo_texto || "")));
    fila.addEventListener("click", () => abrir(c.id));
    cont.appendChild(fila);
  }
}

async function abrir(id) {
  actual = id; firmaHilo = ""; location.hash = "c" + id;
  await cargarHilo(true); cargarLista().catch(() => {});
}

async function cargarHilo(forzar) {
  const d = await api("/api/conversaciones/" + actual);
  const firma = JSON.stringify([d.mensajes.length, d.notas.length, d.conversacion.estado, d.conversacion.agente,
                                d.conversacion.contacto_nombre, d.aviso_ventana, d.mensajes.map(m => m.estado)]);
  if (!forzar && firma === firmaHilo) return;
  firmaHilo = firma;
  const c = d.conversacion;
  $("titulo").textContent = (c.contacto_nombre || c.contacto_id) + " · " + ({ messenger: "Messenger", instagram: "Instagram", whatsapp: "WhatsApp" }[c.canal]);
  const be = $("btn-estado"); be.style.display = "";
  be.textContent = c.estado === "resuelta" ? "Reabrir" : "Marcar como resuelta";
  be.onclick = () => cambiarEstado(c.estado === "resuelta" ? "abierta" : "resuelta");

  const caja = $("mensajes"); caja.replaceChildren();
  for (const m of d.mensajes) {
    const b = el("div", "msj " + m.direccion, m.texto);
    for (const a of m.adjuntos || []) {
      const linea = el("div");
      if (a.url && /^https?:\/\//i.test(a.url)) { const link = el("a", "", "[" + a.tipo + "] abrir"); link.href = a.url; link.target = "_blank"; link.rel = "noopener noreferrer"; linea.appendChild(link); }
      else linea.textContent = "[" + a.tipo + (a.nombre ? ": " + a.nombre : "") + "]";
      b.appendChild(linea);
    }
    b.appendChild(el("div", "pie", hora(m.fecha) + (m.autor ? " · " + m.autor : "") + (m.estado ? " · " + m.estado : "")));
    caja.appendChild(b);
  }
  caja.scrollTop = caja.scrollHeight;

  const aviso = $("aviso");
  aviso.style.display = d.aviso_ventana ? "block" : "none"; aviso.textContent = d.aviso_ventana || "";
  $("responder").style.display = "flex";
  $("detalle").style.display = "block";
  $("contacto").textContent = (c.contacto_nombre ? c.contacto_nombre + " · " : "") + c.contacto_id;
  $("agente").value = c.agente || "";

  const notas = $("notas"); notas.replaceChildren();
  for (const n of d.notas) {
    const div = el("div", "nota", n.texto);
    div.appendChild(el("div", "pie", n.autor + " · " + hora(n.fecha)));
    notas.appendChild(div);
  }
}

async function cambiarEstado(estado) {
  try { await api(`/api/conversaciones/${actual}/estado`, { method: "POST", body: JSON.stringify({ estado }) }); refrescar(); }
  catch (e) { alert(e.message); }
}

$("agente").addEventListener("change", async () => {
  try { await api(`/api/conversaciones/${actual}/asignar`, { method: "POST", body: JSON.stringify({ agente: $("agente").value || null }) }); refrescar(); }
  catch (e) { alert(e.message); }
});

$("responder").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const texto = $("texto").value.trim();
  if (!texto) return;
  const boton = ev.target.querySelector("button"); boton.disabled = true;
  try {
    await api(`/api/conversaciones/${actual}/responder`, { method: "POST", body: JSON.stringify({ texto, autor: yo }) });
    $("texto").value = ""; await cargarHilo(true); cargarLista();
  } catch (e) { if (e.message !== "401") alert("No se envió: " + e.message); }
  finally { boton.disabled = false; }
});
$("texto").addEventListener("keydown", (ev) => { if (ev.key === "Enter" && ev.ctrlKey) $("responder").requestSubmit(); });

$("form-nota").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const texto = $("nota").value.trim();
  if (!texto) return;
  try { await api(`/api/conversaciones/${actual}/notas`, { method: "POST", body: JSON.stringify({ texto, autor: yo }) }); $("nota").value = ""; cargarHilo(true); }
  catch (e) { alert(e.message); }
});

for (const id of ["f-estado", "f-canal"]) $(id).addEventListener("change", refrescar);
let espera; $("f-buscar").addEventListener("input", () => { clearTimeout(espera); espera = setTimeout(refrescar, 300); });

if (clave) api("/api/config").then(iniciar).catch(() => {});
$("yo").value = yo;
</script>
</body>
</html>
